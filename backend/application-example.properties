# GeoSmart Manager local development example.
# Copy values into your local environment or application-local.properties.
# Do not commit real Gmail app passwords, SMTP passwords, or production secrets.

DB_URL=jdbc:postgresql://localhost:5432/geosmart
DB_USER=geosmart
DB_PASSWORD=geosmart

# Default local password for seeded demo accounts only.
# Change this before sharing any deployed demo.
DEFAULT_TEST_PASSWORD=ChangeMe123!

# Email delivery is disabled unless SMTP values are configured.
# For Gmail, use a Gmail App Password, not your normal Gmail password.
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USERNAME=
SMTP_PASSWORD=
SMTP_FROM=
SMTP_AUTH=true
SMTP_STARTTLS=true

APP_AUTH_PASSWORD_RESET_URL_BASE=http://localhost:5173/reset-password
APP_AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES=30
